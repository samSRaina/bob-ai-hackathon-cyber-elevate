services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bobengine
      POSTGRES_PASSWORD: bobengine
      POSTGRES_DB: bobengine
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bobengine"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
