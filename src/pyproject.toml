[project]
name = "bob-engine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "sqlmodel>=0.0.21",
    "psycopg[binary]>=3.2.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "rapidfuzz>=3.10.0",
    "metaphone>=0.6",
    "sentence-transformers>=3.3.0",
    "numpy>=2.2.0",
    "networkx>=3.4.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = []
